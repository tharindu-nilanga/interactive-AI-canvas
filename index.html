<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive AI Canvas</title>
  <link rel="icon" type="image/png" href="icons8-chinchilla-60.png">
  <style>
    :root {
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --bg: #0c0e12;
      --panel: #12151b;
      --surface: #171b23;
      --border: #2a303d;
      --border-strong: #3c4557;
      --text: #e6ebf2;
      --muted: #8892a4;
      --accent: #3b82f6;
      --accent-ink: #ffffff;
      --ok: #34d399;
      --pen: #f59e0b;
      --pan: #38bdf8;
      --voice: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0;
    }

    body {
      font-family: var(--mono);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr 356px;
      overflow: hidden;
      font-size: 13px;
    }

    .stage-wrap {
      position: relative;
      height: 100vh;
      background-color: var(--bg);
      overflow: hidden;
      cursor: grab;
    }

    .stage-wrap.pan-off {
      cursor: default;
    }

    .stage-wrap.panning {
      cursor: grabbing;
    }

    .stage-wrap.panning,
    .stage-wrap.pen-mode {
      user-select: none;
    }

    .world {
      position: absolute;
      left: 0;
      top: 0;
      width: 4000px;
      height: 4000px;
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 24px 24px;
      transform: translate3d(0px, 0px, 0);
      will-change: transform;
    }

    #pen-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* ink never eats a click; pen input is handled on the stage */
      z-index: 5;
    }

    .stage-wrap.pen-mode {
      cursor: crosshair;
    }

    .card {
      position: absolute;
      width: 268px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.55);
      z-index: 10;
      display: flex;
      flex-direction: column;
      min-height: 96px;
      min-width: 200px;
      cursor: default;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex: 0 0 auto;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 6px 8px 6px 10px;
      cursor: grab;
      user-select: none;
    }

    .card-header:active {
      cursor: grabbing;
      color: var(--text);
    }

    .card-title {
      flex: 1 1 auto;
      min-width: 0;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-kind {
      flex: 0 0 auto;
      font-size: 9px;
      letter-spacing: 0.08em;
      color: var(--muted);
      border-right: 1px solid var(--border);
      padding-right: 7px;
    }

    .card-close {
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      padding: 1px 5px;
      font-size: 10.5px;
      line-height: 1.2;
      flex-shrink: 0;
    }

    .card-close:hover {
      background: #2a1418;
      color: #fca5a5;
      border-color: #7f1d1d;
      filter: none;
    }

    .card-body {
      padding: 10px;
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      display: flex;
      flex-direction: column;
    }

    /* bottom-right resize grip */
    .card-resize {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 16px;
      height: 16px;
      cursor: nwse-resize;
      touch-action: none;
      z-index: 3;
      background-image:
        linear-gradient(135deg, transparent 0 55%, var(--border-strong) 55% 66%, transparent 66%),
        linear-gradient(135deg, transparent 0 78%, var(--border-strong) 78% 88%, transparent 88%);
    }

    .card-resize:hover {
      background-image:
        linear-gradient(135deg, transparent 0 55%, var(--accent) 55% 66%, transparent 66%),
        linear-gradient(135deg, transparent 0 78%, var(--accent) 78% 88%, transparent 88%);
    }

    /* quiz answering */
    .quiz-input-shell {
      display: flex;
      gap: 6px;
      align-items: stretch;
      margin-top: 8px;
    }

    .quiz-input-shell input {
      flex: 1;
      min-width: 0;
      font-family: var(--mono);
      font-size: 12px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border-strong);
      padding: 5px 7px;
      outline: none;
    }

    .quiz-input-shell input:focus {
      border-color: var(--accent);
    }

    .quiz-choices {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 8px;
    }

    .quiz-choice {
      text-align: left;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border-strong);
      text-transform: none;
      letter-spacing: 0;
      font-size: 12px;
      padding: 6px 8px;
    }

    .quiz-choice.ok {
      border-color: #1f4638;
      background: #0e1c17;
      color: var(--ok);
    }

    .quiz-choice.bad {
      border-color: #7f1d1d;
      background: #2a1418;
      color: #fca5a5;
    }

    .quiz-feedback {
      display: none;
      font-size: 11.5px;
      line-height: 1.4;
      margin-top: 7px;
      padding: 6px 8px;
      border: 1px solid transparent;
      white-space: pre-wrap;
    }

    .quiz-feedback.ok {
      display: block;
      color: var(--ok);
      background: #0e1c17;
      border-color: #1f4638;
    }

    .quiz-feedback.bad {
      display: block;
      color: #fca5a5;
      background: #2a1418;
      border-color: #7f1d1d;
    }

    .card.quiz-solved {
      border-color: #1f4638;
    }

    /* generic block content (any kind the model invents) */
    .block-list {
      padding-left: 18px;
      font-size: 12px;
      line-height: 1.5;
    }

    .block-list li + li {
      margin-top: 4px;
    }

    .block-kv {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 12px;
    }

    .block-kv > div {
      display: flex;
      gap: 8px;
      align-items: baseline;
    }

    .kv-key {
      flex: 0 0 34%;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .kv-val {
      flex: 1;
      min-width: 0;
      word-break: break-word;
      line-height: 1.4;
    }

    .block-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11.5px;
    }

    .block-table th,
    .block-table td {
      border: 1px solid var(--border);
      padding: 4px 6px;
      text-align: left;
      vertical-align: top;
    }

    .block-table th {
      background: var(--panel);
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* matrix / sudoku grid */
    .block-grid {
      border-collapse: collapse;
      margin: 0 auto;
      font-size: 13px;
      letter-spacing: 0.06em;
    }

    .block-grid td {
      width: 26px;
      height: 26px;
      text-align: center;
      vertical-align: middle;
      border: 1px solid var(--border-strong);
      color: var(--text);
    }

    .block-grid td.empty {
      color: #46506a;
    }

    /* body children must never be squeezed: a flex column with auto height was
       clipping the last row of a list */
    .card-body > * {
      flex: 0 0 auto;
    }

    .block-checklist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 12px;
      line-height: 1.4;
    }

    /* beats the generic ".card-body > ul" indent further down */
    .card-body > ul.block-checklist {
      padding-left: 0;
      margin-bottom: 0;
    }

    .block-checklist label {
      display: flex;
      gap: 7px;
      align-items: flex-start;
      cursor: pointer;
    }

    .block-checklist input {
      margin-top: 2px;
      accent-color: var(--accent);
    }

    .block-formula {
      font-size: 14px;
      color: #93c5fd;
      padding: 10px 8px;
      text-align: center;
      border: 1px dashed var(--border-strong);
      background: var(--bg);
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .plot-note {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      font-size: 9.5px;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-top: 5px;
      overflow: hidden;
    }

    .plot-note span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card canvas {
      width: 100%;
      height: 124px;
      flex: 1 1 auto;
      min-height: 80px;
      background: var(--bg);
      border: 1px solid var(--border);
      display: block;
      margin-bottom: 5px;
    }

    .note-text,
    .quiz-q {
      font-size: 12.5px;
      line-height: 1.45;
      margin-bottom: 10px;
      white-space: normal;
    }

    .quiz-q {
      white-space: pre-wrap;
    }

    /* markdown blocks (free-form cards and notes) */
    .md-h {
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
      margin: 10px 0 6px;
    }

    .note-text > .md-h:first-child,
    .card-body > .md-h:first-child {
      margin-top: 0;
    }

    .md-p {
      font-size: 12.5px;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .md-p:last-child {
      margin-bottom: 0;
    }

    .md-pre {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 7px 8px;
      font-size: 11px;
      line-height: 1.45;
      overflow-x: auto;
      white-space: pre;
      margin-bottom: 8px;
    }

    .md-quote {
      border-left: 2px solid var(--border-strong);
      padding-left: 8px;
      color: var(--muted);
      font-style: italic;
      margin-bottom: 8px;
    }

    .note-text code,
    .md-p code,
    .block-list code {
      background: #0f1319;
      border: 1px solid var(--border);
      padding: 0 3px;
      font-size: 11px;
    }

    .note-text a,
    .md-p a {
      color: #93c5fd;
    }

    .note-text ul,
    .note-text ol,
    .card-body > ul,
    .card-body > ol {
      padding-left: 18px;
      margin-bottom: 8px;
    }

    .card-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 8px 0;
    }

    .quiz-a {
      display: none;
      font-size: 12px;
      line-height: 1.4;
      color: var(--ok);
      background: #0e1c17;
      border: 1px solid #1f4638;
      padding: 7px 9px;
      margin-top: 8px;
    }

    button {
      font-family: var(--mono);
      background: var(--accent);
      color: var(--accent-ink);
      border: 1px solid var(--accent);
      padding: 6px 8px;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button.secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border-strong);
    }

    button.secondary.active-pen {
      background: var(--pen);
      color: #0c0e12;
      border-color: var(--pen);
      font-weight: 700;
    }

    button.secondary.active-pan {
      background: var(--pan);
      color: #0c0e12;
      border-color: var(--pan);
      font-weight: 700;
    }

    button.secondary.active-voice {
      background: var(--voice);
      color: #ffffff;
      border-color: var(--voice);
      font-weight: 700;
    }

    .sidebar {
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      z-index: 30;
    }

    .sidebar-top {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    .indicators {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      font-size: 11px;
    }

    .ind-cell {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 6px 7px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      color: var(--muted);
    }

    .ind-val {
      color: var(--text);
      font-weight: 600;
    }

    .ind-val.live-pen { color: var(--pen); }
    .ind-val.live-pan { color: var(--pan); }
    .ind-val.live-voice { color: var(--ok); }

    .toolbar {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .toolbar .span-2 {
      grid-column: 1 / -1;
    }

    .toolbar button.danger:hover:not(:disabled) {
      border-color: #7f1d1d;
      color: #fca5a5;
      background: #2a1418;
    }

    .toolbar button:disabled {
      opacity: 0.4;
      cursor: default;
      filter: none;
    }

    .shortcut-hint {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.03em;
    }

    .transcript-strip {
      display: none;
      padding: 7px 12px;
      font-size: 11px;
      color: #fde68a;
      background: #1a160c;
      border-bottom: 1px solid #453513;
    }

    .transcript-strip.visible {
      display: block;
    }

    .history-header {
      padding: 8px 12px;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: #0f1217;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 11.5px;
      line-height: 1.45;
    }

    .history-item {
      border: 1px solid var(--border);
      background: var(--bg);
      padding: 8px;
    }

    .history-meta {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .history-prompt {
      color: #93c5fd;
      margin-bottom: 4px;
    }

    .history-reply {
      color: var(--text);
    }

    .prompt-bar-wrap {
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .input-shell {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--border-strong);
      background: var(--bg);
    }

    .input-shell:focus-within {
      border-color: var(--accent);
    }

    .input-shell input {
      flex: 1;
      min-width: 0;
      font-family: var(--mono);
      background: transparent;
      color: var(--text);
      border: none;
      padding: 8px 10px;
      font-size: 12px;
      outline: none;
    }

    .input-shell button {
      border: none;
      border-left: 1px solid var(--border-strong);
      padding: 0 12px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="stage-wrap" id="stage">
    <div class="world" id="world"></div>
    <!-- ink lives in the viewport, not the world: no giant bitmap, and the board
         can grow without ever growing this canvas -->
    <canvas id="pen-layer"></canvas>
  </div>

  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="sidebar-title">[ CANVAS // TELEMETRY ]</div>
      <div class="indicators">
        <div class="ind-cell">
          <span>INK</span>
          <span id="ind-pen" class="ind-val">OFF</span>
        </div>
        <div class="ind-cell">
          <span>VOICE</span>
          <span id="ind-voice" class="ind-val">OFF</span>
        </div>
        <div class="ind-cell">
          <span>BLOCKS</span>
          <span id="ind-blocks" class="ind-val">0</span>
        </div>
      </div>
      <div class="toolbar">
        <button id="pan-toggle" class="secondary active-pan" type="button">[H] PAN: ON</button>
        <button id="pen-toggle" class="secondary" type="button">[P] PEN: OFF</button>
        <button id="voice-toggle" class="secondary" type="button">[V] VOICE: OFF</button>
        <button id="clear-pen" class="secondary" type="button">[C] CLEAR INK</button>
        <button id="reset-pan" class="secondary span-2" type="button">[R] RESET PAN (0, 0)</button>
        <button id="clear-blocks" class="secondary danger span-2" type="button" disabled>
          CLEAR ALL BLOCKS
        </button>
      </div>
      <div class="shortcut-hint">KEYS: H=PAN | P=PEN | V=VOICE | C=CLEAR | R=RESET | /=PROMPT</div>
    </div>

    <div id="transcript-strip" class="transcript-strip">MIC: ...</div>

    <div class="history-header">[ SESSION // HISTORY ]</div>
    <div class="history-list" id="history-list">
      <div class="history-item">
        <div class="history-meta">SYS // READY</div>
        <div class="history-reply">Shortcuts active (H/P/V/C/R, / to focus prompt, Esc to exit input).</div>
      </div>
    </div>

    <form id="prompt-form" class="prompt-bar-wrap">
      <div class="input-shell">
        <input
          id="prompt-input"
          type="text"
          placeholder="Enter topic or command... [/]"
          autocomplete="off"
          required
        />
        <button type="submit">SEND</button>
      </div>
    </form>
  </aside>

  <script>
    // The proxy (server.py) owns the API key and the system prompt. The browser
    // only ever talks to same-origin /api/*, so no secret ships in this file.
    const API_CONFIG = {
      chat: "/api/chat",
      health: "/api/health",
      offlineMock: true // keep the demo alive if the proxy isn't running
    };

    // What this page can actually draw. The proxy builds its prompt from this list,
    // so a renderer added below reaches the model without editing the server.
    // There is deliberately no second copy of the block schema in this file: one
    // source of truth per side, or the two drift and cards render empty.
    function rendererKinds() {
      return Object.keys(ELEMENT_RENDERERS).filter((kind) => kind !== "dynamic");
    }

    // The prompt itself is built in server.py — GET /api/prompt shows it.

    const stage = document.getElementById("stage");
    const world = document.getElementById("world");
    const penCanvas = document.getElementById("pen-layer");
    const penCtx = penCanvas.getContext("2d");
    const panToggle = document.getElementById("pan-toggle");
    const penToggle = document.getElementById("pen-toggle");
    const voiceToggle = document.getElementById("voice-toggle");
    const clearPenBtn = document.getElementById("clear-pen");
    const clearBlocksBtn = document.getElementById("clear-blocks");
    const resetPanBtn = document.getElementById("reset-pan");
    const indPen = document.getElementById("ind-pen");
    const indVoice = document.getElementById("ind-voice");
    const indBlocks = document.getElementById("ind-blocks");
    const transcriptStrip = document.getElementById("transcript-strip");
    const historyList = document.getElementById("history-list");
    const promptForm = document.getElementById("prompt-form");
    const promptInput = document.getElementById("prompt-input");

    // The board starts at 4000² and grows as blocks land near the edge, so you never
    // hit a wall mid-session. Ink is not stored here: strokes are, in world units.
    const WORLD_MIN = 4000;
    const WORLD_MAX = 16000;
    let worldW = WORLD_MIN;
    let worldH = WORLD_MIN;

    const boardState = {
      elements: [],
      events: [],   // semantic things the student did (drained into the next request)
      removed: [],  // detached cards, so a wrongful delete can be undone
      panX: 0,
      panY: 0,
      panMode: true,
      isPanning: false,
      spaceHeld: false,
      penMode: false,
      drawing: false,
      voiceMode: false
    };

    function applyPanTransform() {
      world.style.transform = `translate3d(${boardState.panX}px, ${boardState.panY}px, 0)`;
      redrawInk();
    }

    function resetPanToOrigin() {
      boardState.panX = 0;
      boardState.panY = 0;
      applyPanTransform();
      addHistoryEntry("PAN RESET", "View snapped back to origin (0, 0).", 0);
    }

    // ---- ink -------------------------------------------------------------
    // Strokes are kept in world coordinates and replayed onto a viewport-sized
    // canvas, so ink survives panning, window resizing and a growing board.
    const inkStrokes = [];
    let activeStroke = null;

    function penStyle() {
      penCtx.strokeStyle = "#f59e0b";
      penCtx.lineWidth = 2;
      penCtx.lineCap = "square";
      penCtx.lineJoin = "round";
    }

    function applyInkTransform() {
      const dpr = window.devicePixelRatio || 1;
      penCtx.setTransform(dpr, 0, 0, dpr, boardState.panX * dpr, boardState.panY * dpr);
    }

    function drawStroke(stroke) {
      const points = stroke && stroke.points;
      if (!points || !points.length) return;
      penCtx.beginPath();
      penCtx.moveTo(points[0].x, points[0].y);
      if (points.length === 1) {
        penCtx.lineTo(points[0].x + 0.1, points[0].y + 0.1);
      } else {
        for (let i = 1; i < points.length; i += 1) penCtx.lineTo(points[i].x, points[i].y);
      }
      penCtx.stroke();
    }

    function redrawInk() {
      const dpr = window.devicePixelRatio || 1;
      penCtx.setTransform(1, 0, 0, 1, 0, 0);
      penCtx.clearRect(0, 0, penCanvas.width, penCanvas.height);
      applyInkTransform();
      penStyle();
      inkStrokes.forEach(drawStroke);
      if (activeStroke) drawStroke(activeStroke);
    }

    function sizePenCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const width = Math.max(1, Math.round(stage.clientWidth * dpr));
      const height = Math.max(1, Math.round(stage.clientHeight * dpr));
      if (penCanvas.width === width && penCanvas.height === height) {
        redrawInk();
        return;
      }
      penCanvas.width = width;
      penCanvas.height = height;
      redrawInk();
    }

    function initPenCanvas() {
      sizePenCanvas();
    }
    initPenCanvas();

    // Grow the board when blocks approach the edge: always leave a screen of space.
    function ensureWorldBounds() {
      let maxX = 0;
      let maxY = 0;
      boardState.elements.forEach((el) => {
        maxX = Math.max(maxX, el.x + (el.w || 268));
        maxY = Math.max(maxY, el.y + (el.h || 160));
      });

      const step = 1000;
      // grow only: shrinking could strand the current view outside the board
      const needW = Math.min(WORLD_MAX, Math.max(worldW, Math.ceil((maxX + stage.clientWidth) / step) * step));
      const needH = Math.min(WORLD_MAX, Math.max(worldH, Math.ceil((maxY + stage.clientHeight) / step) * step));
      if (needW === worldW && needH === worldH) return;

      worldW = needW;
      worldH = needH;
      world.style.width = `${worldW}px`;
      world.style.height = `${worldH}px`;
    }

    function clampPan() {
      const minX = Math.min(0, stage.clientWidth - worldW);
      const minY = Math.min(0, stage.clientHeight - worldH);
      boardState.panX = Math.max(minX, Math.min(0, boardState.panX));
      boardState.panY = Math.max(minY, Math.min(0, boardState.panY));
    }

    window.addEventListener("resize", () => {
      ensureWorldBounds();
      clampPan();
      sizePenCanvas();
      applyPanTransform();
    });

    function updateBlockCounter() {
      indBlocks.textContent = String(boardState.elements.length);
      if (clearBlocksBtn) clearBlocksBtn.disabled = boardState.elements.length === 0;
    }

    // ---- board events ----------------------------------------------------
    // Semantic actions only. Moves and resizes are logged once per gesture (on
    // release), and only the latest one per block is kept, so they can't crowd out
    // quiz and checklist events or burn tokens.
    function recordBoardEvent(type, detail = {}) {
      const event = { type, ...detail };
      if (type === "block_moved" || type === "block_resized") {
        boardState.events = boardState.events.filter((e) => !(e.type === type && e.id === event.id));
      }
      const last = boardState.events[boardState.events.length - 1];
      if (last && JSON.stringify(last) === JSON.stringify(event)) return;
      boardState.events.push(event);
      if (boardState.events.length > 24) boardState.events.shift();
    }

    function eventForCard(body, type, detail = {}) {
      const card = body.closest(".card");
      const record = card ? boardState.elements.find((el) => el.id === card.dataset.id) : null;
      recordBoardEvent(type, {
        id: record ? record.id : card ? card.dataset.id : undefined,
        title: record ? record.title : undefined,
        ...detail
      });
    }

    // ---- panel control ---------------------------------------------------
    // Deletes are destructive, so matching is strict: id, then exact title, then a
    // partial title only if it is unambiguous and no (wrong) id was supplied.
    function findRecord(target) {
      if (!target || typeof target !== "object") return null;
      const id = target.id || target.target_id;
      if (id) {
        const byId = boardState.elements.find((el) => el.id === String(id));
        if (byId) return byId;
      }
      const name = target.title || target.target;
      if (!name) return null;
      const needle = String(name).trim().toLowerCase();
      if (!needle) return null;
      const titleOf = (el) => String(el.title).toLowerCase();
      let hits = boardState.elements.filter((el) => titleOf(el) === needle || el.id === String(name));
      if (!hits.length && !id) hits = boardState.elements.filter((el) => titleOf(el).includes(needle));
      return hits.length === 1 ? hits[0] : null;
    }

    function deleteRecord(record) {
      if (!record || !record.el) return false;
      record.el.remove(); // detach, keep the node so undo can restore it
      boardState.elements = boardState.elements.filter((el) => el !== record);
      boardState.removed.push(record);
      if (boardState.removed.length > 50) boardState.removed.shift();
      updateBlockCounter();
      return true;
    }

    function undoRemove() {
      const record = boardState.removed.pop();
      if (!record) return false;
      world.appendChild(record.el);
      boardState.elements.push(record);
      recordBoardEvent("block_restored", { id: record.id, title: record.title, kind: record.kind });
      updateBlockCounter();
      return true;
    }

    function clearBoard() {
      const all = boardState.elements.slice();
      all.forEach((record) => deleteRecord(record));
      return all.length;
    }

    const CARD_LIMITS = { minW: 200, maxW: 680, minH: 110, maxH: 760 };
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    // null, "" and undefined mean "not provided", not zero
    const optionalNumber = (v) => (v === null || v === undefined || v === "" ? NaN : Number(v));

    // Accept the data shapes models actually send: an object, a bare string, or the
    // fields placed directly on the action ({ type: "add_graph", equation }).
    function normalizeData(action) {
      if (action.data && typeof action.data === "object") return action.data;
      if (typeof action.data === "string") return { text: action.data };
      const meta = ["op", "id", "target_id", "target", "kind", "type", "title", "place", "col", "x", "y", "w", "h", "data"];
      return Object.fromEntries(Object.entries(action).filter(([key]) => !meta.includes(key)));
    }

    function renderInto(body, action) {
      try {
        pickRenderer(action.kind, action.data)(body, action);
      } catch (err) {
        console.warn("renderer failed", action.kind, err);
        body.textContent = "";
      }
      // a renderer that found nothing to draw must never leave an empty card
      if (!body.hasChildNodes()) ELEMENT_RENDERERS.dynamic(body, action);
    }

    function updateRecord(record, action) {
      if (!record || !record.el) return false;
      let changed = false;
      const hasData = action.data !== undefined && action.data !== null;
      const kind = action.kind ? String(action.kind).toLowerCase() : record.kind;

      // a new title only counts when it isn't the key we used to find the block
      if (action.new_title || (action.title && (action.id || action.target_id))) {
        const title = String(action.new_title || action.title).slice(0, 60);
        if (title !== record.title) {
          record.title = title;
          record.el.querySelector(".card-title").textContent = title;
          changed = true;
        }
      }

      if (hasData || kind !== record.kind) {
        record.kind = kind;
        if (hasData) record.data = normalizeData(action); // replaces, does not merge
        const kindEl = record.el.querySelector(".card-kind");
        kindEl.textContent = kind.toUpperCase();
        kindEl.title = kind;
        const body = record.el.querySelector(".card-body");
        body.textContent = ""; // drop old children, including canvases
        record.el.classList.remove("quiz-solved");
        renderInto(body, { kind, title: record.title, data: record.data });
        changed = true;
      }

      const w = optionalNumber(action.w);
      const h = optionalNumber(action.h);
      if (Number.isFinite(w) || Number.isFinite(h)) {
        if (Number.isFinite(w)) record.el.style.width = `${clamp(w, CARD_LIMITS.minW, CARD_LIMITS.maxW)}px`;
        if (Number.isFinite(h)) record.el.style.height = `${clamp(h, CARD_LIMITS.minH, CARD_LIMITS.maxH)}px`;
        changed = true;
      }
      record.w = record.el.offsetWidth;
      record.h = record.el.offsetHeight;
      return changed;
    }

    function moveRecord(record, action) {
      if (!record || !record.el) return false;
      const x = optionalNumber(action.x ?? action.data?.x);
      const y = optionalNumber(action.y ?? action.data?.y);
      if (!Number.isFinite(x) && !Number.isFinite(y)) return false;
      // clamp to the largest board, then let ensureWorldBounds grow to fit
      if (Number.isFinite(x)) record.x = clamp(x, 0, WORLD_MAX - record.w);
      if (Number.isFinite(y)) record.y = clamp(y, 0, WORLD_MAX - record.h);
      record.el.style.left = `${record.x}px`;
      record.el.style.top = `${record.y}px`;
      ensureWorldBounds();
      return true;
    }

    function removeElement(record, card) {
      const ok = deleteRecord(record);
      if (ok) recordBoardEvent("block_closed", { id: record.id, title: record.title, kind: record.kind });
      return ok;
    }

    function addHistoryEntry(promptText, replyText, spawnedCount) {
      const now = new Date().toTimeString().slice(0, 8);
      const item = document.createElement("div");
      item.className = "history-item";
      item.innerHTML = `
        <div class="history-meta">${now} // +${spawnedCount} BLOCK(S)</div>
        <div class="history-prompt"></div>
        <div class="history-reply"></div>
      `;
      item.querySelector(".history-prompt").textContent = `> ${promptText}`;
      item.querySelector(".history-reply").textContent = replyText;
      historyList.appendChild(item);
      historyList.scrollTop = historyList.scrollHeight;
    }

    function setPanMode(enabled) {
      boardState.panMode = enabled;
      if (enabled && boardState.penMode) {
        setPenMode(false);
      }
      stage.classList.toggle("pan-off", !boardState.panMode);
      panToggle.classList.toggle("active-pan", boardState.panMode);
      panToggle.textContent = boardState.panMode ? "[H] PAN: ON" : "[H] PAN: OFF";
    }

    function setPenMode(enabled) {
      boardState.penMode = enabled;
      if (enabled && boardState.panMode) {
        boardState.panMode = false;
        panToggle.classList.remove("active-pan");
        panToggle.textContent = "[H] PAN: OFF";
        stage.classList.add("pan-off");
      }
      stage.classList.toggle("pen-mode", boardState.penMode);
      penToggle.classList.toggle("active-pen", boardState.penMode);
      penToggle.textContent = boardState.penMode ? "[P] PEN: ON" : "[P] PEN: OFF";
      indPen.textContent = boardState.penMode ? "ACTIVE" : "OFF";
      indPen.classList.toggle("live-pen", boardState.penMode);
    }

    function clearInk() {
      inkStrokes.length = 0;
      activeStroke = null;
      redrawInk();
    }

    function toggleVoiceMode() {
      if (!recognition) {
        addHistoryEntry("VOICE", "SpeechRecognition not supported in this browser.", 0);
        return;
      }
      boardState.voiceMode = !boardState.voiceMode;
      voiceToggle.classList.toggle("active-voice", boardState.voiceMode);
      voiceToggle.textContent = boardState.voiceMode ? "[V] VOICE: ON" : "[V] VOICE: OFF";
      indVoice.textContent = boardState.voiceMode ? "LIVE" : "OFF";
      indVoice.classList.toggle("live-voice", boardState.voiceMode);

      if (boardState.voiceMode) {
        transcriptStrip.textContent = "MIC LIVE // SPEAK A COMMAND...";
        transcriptStrip.classList.add("visible");
        try { recognition.start(); } catch (_) {}
      } else {
        transcriptStrip.classList.remove("visible");
        window.speechSynthesis?.cancel();
        try { recognition.stop(); } catch (_) {}
      }
    }

    let panStartX = 0, panStartY = 0, originPanX = 0, originPanY = 0;

    window.addEventListener("keydown", (e) => {
      const target = e.target;
      const isTyping =
        target &&
        ((target.tagName === "INPUT" && !["checkbox", "radio", "button"].includes(target.type)) ||
          target.tagName === "TEXTAREA" ||
          target.isContentEditable);

      if (e.key === "Escape" && isTyping) {
        target.blur();
        return;
      }

      // undo the last removed/cleared block (works for panel deletes too)
      if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === "z" && !isTyping) {
        if (undoRemove()) {
          e.preventDefault();
          addHistoryEntry("UNDO", "Restored the last removed block.", 0);
        }
        return;
      }

      if (isTyping || e.ctrlKey || e.metaKey || e.altKey) return;

      if (e.code === "Space") {
        // a focused checkbox keeps Space for itself
        if (target?.type === "checkbox") return;
        e.preventDefault(); // otherwise Space also "clicks" the last-used button
        boardState.spaceHeld = true;
        return;
      }
      if (e.repeat) return;

      const key = e.key.toLowerCase();
      if (key === "h") {
        e.preventDefault();
        setPanMode(!boardState.panMode);
      } else if (key === "p") {
        e.preventDefault();
        setPenMode(!boardState.penMode);
      } else if (key === "v") {
        e.preventDefault();
        toggleVoiceMode();
      } else if (key === "c") {
        e.preventDefault();
        clearInk();
      } else if (key === "r") {
        e.preventDefault();
        resetPanToOrigin();
      } else if (e.key === "/") {
        e.preventDefault();
        promptInput.focus();
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.code === "Space") {
        if (boardState.spaceHeld) e.preventDefault();
        boardState.spaceHeld = false;
      }
    });

    // Alt-tabbing away mid-hold would otherwise leave Space stuck "down"
    window.addEventListener("blur", () => {
      boardState.spaceHeld = false;
    });

    stage.addEventListener("pointerdown", (e) => {
      if (e.button !== 0 && e.button !== 1) return;
      const panOverride = e.button === 1 || boardState.spaceHeld;
      if (e.button === 1) e.preventDefault(); // no browser autoscroll

      if (boardState.penMode && !panOverride) {
        // cards keep working while the pen is armed: only empty board draws
        if (e.button !== 0 || e.target.closest(".card")) return;
        boardState.drawing = true;
        stage.setPointerCapture(e.pointerId);
        const pt = clientToWorld(e.clientX, e.clientY);
        activeStroke = { points: [pt] };
        applyInkTransform();
        penStyle();
        penCtx.beginPath();
        penCtx.moveTo(pt.x, pt.y);
        return;
      }

      const clickedCard = e.target.closest(".card");
      const canPan = boardState.panMode || panOverride;
      if (!canPan || (clickedCard && !panOverride)) return;

      boardState.isPanning = true;
      stage.classList.add("panning");
      stage.setPointerCapture(e.pointerId);
      panStartX = e.clientX;
      panStartY = e.clientY;
      originPanX = boardState.panX;
      originPanY = boardState.panY;
    });

    stage.addEventListener("pointermove", (e) => {
      if (boardState.drawing && boardState.penMode && activeStroke) {
        const pt = clientToWorld(e.clientX, e.clientY);
        activeStroke.points.push(pt);
        penCtx.lineTo(pt.x, pt.y);
        penCtx.stroke();
        return;
      }
      if (!boardState.isPanning) return;
      const minX = Math.min(0, stage.clientWidth - worldW);
      const minY = Math.min(0, stage.clientHeight - worldH);
      const nextX = originPanX + (e.clientX - panStartX);
      const nextY = originPanY + (e.clientY - panStartY);
      boardState.panX = Math.max(minX, Math.min(0, nextX));
      boardState.panY = Math.max(minY, Math.min(0, nextY));
      applyPanTransform();
    });

    function finishStroke() {
      if (activeStroke && activeStroke.points.length) inkStrokes.push(activeStroke);
      activeStroke = null;
      boardState.drawing = false;
      redrawInk();
    }

    stage.addEventListener("pointerup", () => {
      if (boardState.drawing) finishStroke();
      boardState.isPanning = false;
      stage.classList.remove("panning");
    });

    stage.addEventListener("pointercancel", () => {
      if (boardState.drawing) finishStroke();
      boardState.isPanning = false;
      stage.classList.remove("panning");
    });

    panToggle.addEventListener("click", () => setPanMode(!boardState.panMode));
    penToggle.addEventListener("click", () => setPenMode(!boardState.penMode));
    clearPenBtn.addEventListener("click", clearInk);
    clearBlocksBtn.addEventListener("click", () => {
      const count = boardState.elements.length;
      if (!count) return;
      clearBoard();
      recordBoardEvent("board_cleared", { count });
      addHistoryEntry(
        "CLEAR",
        `Removed ${count} block${count === 1 ? "" : "s"}. Ctrl+Z brings them back one at a time.`,
        0
      );
    });
    resetPanBtn.addEventListener("click", resetPanToOrigin);
    voiceToggle.addEventListener("click", toggleVoiceMode);

    function clientToWorld(clientX, clientY) {
      const sr = stage.getBoundingClientRect();
      return {
        x: clientX - sr.left - boardState.panX,
        y: clientY - sr.top - boardState.panY
      };
    }

    function makeDraggable(card, record) {
      const handle = card.querySelector(".card-header");
      let dragging = false, grabOffsetX = 0, grabOffsetY = 0;
      let startPos = null;

      handle.addEventListener("pointerdown", (e) => {
        if (e.target.closest(".card-close")) return;
        if (boardState.spaceHeld || e.button !== 0) return;
        e.stopPropagation();
        dragging = true;
        startPos = { x: record.x, y: record.y };
        handle.setPointerCapture(e.pointerId);
        const wPt = clientToWorld(e.clientX, e.clientY);
        grabOffsetX = wPt.x - record.x;
        grabOffsetY = wPt.y - record.y;
      });

      handle.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const wPt = clientToWorld(e.clientX, e.clientY);
        const x = Math.max(0, Math.min(worldW - card.offsetWidth, wPt.x - grabOffsetX));
        const y = Math.max(0, Math.min(worldH - card.offsetHeight, wPt.y - grabOffsetY));
        record.x = x;
        record.y = y;
        card.style.left = `${x}px`;
        card.style.top = `${y}px`;
      });

      const stop = () => {
        if (!dragging) return;
        dragging = false;
        if (record.x === startPos.x && record.y === startPos.y) return;
        recordBoardEvent("block_moved", {
          id: record.id, title: record.title, x: Math.round(record.x), y: Math.round(record.y)
        });
        ensureWorldBounds();
      };
      handle.addEventListener("pointerup", stop);
      handle.addEventListener("pointercancel", stop);
    }

    // ---- resizing -------------------------------------------------------
    function applyCardSize(card, record, w, h) {
      card.style.width = `${w}px`;
      card.style.height = `${h}px`;
      record.w = w;
      record.h = h;
      // the canvas grows via flexbox (see .card canvas); its ResizeObserver redraws the plot

      const maxLeft = worldW - w;
      const maxTop = worldH - h;
      if (record.x > maxLeft) {
        record.x = Math.max(0, maxLeft);
        card.style.left = `${record.x}px`;
      }
      if (record.y > maxTop) {
        record.y = Math.max(0, maxTop);
        card.style.top = `${record.y}px`;
      }
    }

    function makeResizable(card, record) {
      const grip = card.querySelector(".card-resize");
      if (!grip) return;
      let resizing = false;
      let startX = 0;
      let startY = 0;
      let startW = 0;
      let startH = 0;

      grip.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return;
        e.stopPropagation();
        e.preventDefault();
        resizing = true;
        grip.setPointerCapture(e.pointerId);
        startX = e.clientX;
        startY = e.clientY;
        startW = card.offsetWidth;
        startH = card.offsetHeight;
      });

      grip.addEventListener("pointermove", (e) => {
        if (!resizing) return;
        const w = clamp(startW + (e.clientX - startX), CARD_LIMITS.minW, CARD_LIMITS.maxW);
        const h = clamp(startH + (e.clientY - startY), CARD_LIMITS.minH, CARD_LIMITS.maxH);
        applyCardSize(card, record, w, h);
      });

      const stop = () => {
        if (!resizing) return;
        resizing = false;
        if (record.w === startW && record.h === startH) return;
        recordBoardEvent("block_resized", { id: record.id, title: record.title, w: record.w, h: record.h });
        ensureWorldBounds();
      };
      grip.addEventListener("pointerup", stop);
      grip.addEventListener("pointercancel", stop);
    }

    // ---- answer grading -------------------------------------------------
    // Local, so a quiz works offline and costs no tokens.
    function normalizeAnswer(v) {
      return String(v ?? "")
        .replace(/²/g, "^2")
        .replace(/³/g, "^3")
        .normalize("NFKC")
        .toLowerCase()
        .replace(/\u2212/g, "-")
        .replace(/\*\*/g, "^")
        .replace(/(\d),(?=\d{3}(?!\d))/g, "$1")
        .replace(/[\s*$`"']/g, "")
        .replace(/[.,;]+$/, "");
    }

    // The numbers in an answer that is only a list of values ("x = 3 and x = 1",
    // "1, 3"). Returns null for anything else, so "x^2" never matches "2x".
    function valueList(v) {
      const number = /-?(?:\d+(?:\.\d+)?|\.\d+)/g;
      const text = String(v).toLowerCase().replace(/\u2212/g, "-");
      const names = new Set((text.match(/\b[a-z]\s*=/g) || []).map((m) => m[0]));
      if (names.size > 1) return null;
      const leftover = text
        .replace(/\b[a-z]\s*=/g, " ")
        .replace(number, " ")
        .replace(/\b(and|or)\b|[,;&\s]|\.$/g, "");
      if (leftover) return null;
      return (text.match(number) || []).map(Number).sort((a, b) => a - b);
    }

    function answersMatch(given, expected) {
      const a = normalizeAnswer(given);
      const b = normalizeAnswer(expected);
      if (!a || !b) return false;
      if (a === b) return true;

      // "x = 3 and x = 1" should match "x = 1 and x = 3"
      const na = valueList(given);
      const nb = valueList(expected);
      if (!na || !nb || !nb.length || na.length !== nb.length) return false;
      return na.every((value, i) => Math.abs(value - nb[i]) < 1e-9);
    }

    // Which choice is right? Exact text first, then a letter key ("B"), and only
    // then loose matching, which must single out exactly one choice.
    function correctChoiceIndex(choices, expected) {
      const wanted = normalizeAnswer(expected);
      const exact = choices.findIndex((c) => normalizeAnswer(c) === wanted);
      if (exact !== -1) return exact;
      const letter = String(expected).trim().match(/^\(?([a-f])[).]?$/i);
      if (letter) {
        const i = letter[1].toLowerCase().charCodeAt(0) - 97;
        if (i < choices.length) return i;
      }
      const loose = choices.map((c, i) => (answersMatch(c, expected) ? i : -1)).filter((i) => i !== -1);
      return loose.length === 1 ? loose[0] : -1;
    }

    const EXPR_FUNCS = {
      sin: Math.sin, cos: Math.cos, tan: Math.tan, asin: Math.asin, acos: Math.acos,
      atan: Math.atan, sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh,
      sqrt: Math.sqrt, cbrt: Math.cbrt, abs: Math.abs, exp: Math.exp,
      ln: Math.log, log: Math.log10, log10: Math.log10, floor: Math.floor,
      ceil: Math.ceil, round: Math.round, sign: Math.sign
    };
    const EXPR_CONSTS = { pi: Math.PI, PI: Math.PI, e: Math.E, E: Math.E };
    const hasOwn = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key);

    // Compile "x^2 - 4x + 3" into a closure with a small recursive-descent parser.
    // Nothing is ever eval'd: only x, the constants and the functions above exist.
    // Precedence: ^ (right-assoc), then unary minus, then * / and implicit "2x".
    function compileExpression(expr) {
      const src = String(expr || "")
        .replace(/²/g, "^2")
        .replace(/³/g, "^3")
        .replace(/\u2212/g, "-")
        .replace(/\u03c0/g, "pi")
        .replace(/\*\*/g, "^")
        .trim()
        .replace(/^(?:[a-zA-Z]\s*\(\s*x\s*\)|y)\s*=/, "")
        .trim();
      if (!src || src.length > 200) return null;

      const tokens = src.match(/\d+(?:\.\d*)?|\.\d+|[a-zA-Z_]\w*|\S/g) || [];
      let pos = 0;
      const peek = () => tokens[pos];
      const fail = () => { throw new Error("bad expression"); };
      const expect = (t) => { if (tokens[pos++] !== t) fail(); };

      const sum = () => {
        let left = product();
        while (peek() === "+" || peek() === "-") {
          const op = tokens[pos++];
          const a = left, b = product();
          left = op === "+" ? (x) => a(x) + b(x) : (x) => a(x) - b(x);
        }
        return left;
      };
      const product = () => {
        let left = unary();
        for (;;) {
          const t = peek();
          const explicit = t === "*" || t === "/";
          const implicit = t !== undefined && /^[a-zA-Z_(]/.test(t);
          if (!explicit && !implicit) return left;
          if (explicit) pos++;
          const a = left, b = explicit ? unary() : power();
          left = t === "/" ? (x) => a(x) / b(x) : (x) => a(x) * b(x);
        }
      };
      const unary = () => {
        if (peek() === "-") { pos++; const a = unary(); return (x) => -a(x); }
        if (peek() === "+") { pos++; return unary(); }
        return power();
      };
      const power = () => {
        const base = primary();
        if (peek() !== "^") return base;
        pos++;
        const exp = unary();
        return (x) => Math.pow(base(x), exp(x));
      };
      const primary = () => {
        const t = tokens[pos++];
        if (t === undefined) fail();
        if (t === "(") { const inner = sum(); expect(")"); return inner; }
        if (/^[\d.]/.test(t)) { const n = Number(t); if (!Number.isFinite(n)) fail(); return () => n; }
        if (t === "x") return (x) => x;
        if (hasOwn(EXPR_CONSTS, t)) { const c = EXPR_CONSTS[t]; return () => c; }
        if (hasOwn(EXPR_FUNCS, t)) {
          const f = EXPR_FUNCS[t];
          expect("(");
          const arg = sum();
          expect(")");
          return (x) => f(arg(x));
        }
        return fail();
      };

      try {
        const fn = sum();
        return pos === tokens.length ? fn : null;
      } catch (_) {
        return null;
      }
    }

    const plotRegistry = new Set();

    function registerPlot(canvas, expr, noteEl) {
      const draw = () => {
        if (!canvas.isConnected) { plotRegistry.delete(draw); return; }
        drawSimplePlot(canvas, expr, noteEl);
      };
      plotRegistry.add(draw);
      if (typeof ResizeObserver !== "undefined") new ResizeObserver(draw).observe(canvas);
      requestAnimationFrame(draw);
    }

    window.addEventListener("resize", () => plotRegistry.forEach((d) => d()));

    function drawSimplePlot(canvas, expr, noteEl) {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (!w || !h) return false; // not laid out yet; caller retries on next frame

      const ctx = canvas.getContext("2d");
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2;
      // square units: one unit is the same number of px on both axes
      const unit = Math.max(12, Math.min(34, Math.min(w, h) / 8));

      ctx.strokeStyle = "#1a202b";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let gx = cx % unit; gx <= w; gx += unit) { ctx.moveTo(gx, 0); ctx.lineTo(gx, h); }
      for (let gy = cy % unit; gy <= h; gy += unit) { ctx.moveTo(0, gy); ctx.lineTo(w, gy); }
      ctx.stroke();

      ctx.strokeStyle = "#3c4557";
      ctx.beginPath();
      ctx.moveTo(0, cy); ctx.lineTo(w, cy);
      ctx.moveTo(cx, 0); ctx.lineTo(cx, h);
      ctx.stroke();

      const fn = compileExpression(expr);
      if (!fn) {
        ctx.fillStyle = "#ef4444";
        ctx.font = "10px ui-monospace, monospace";
        ctx.fillText("UNPARSED EXPRESSION", 8, h - 8);
        if (noteEl && noteEl.firstChild) noteEl.firstChild.textContent = "INVALID";
        return true;
      }

      ctx.strokeStyle = "#60a5fa";
      ctx.lineWidth = 2;
      ctx.beginPath();
      let pen = false;
      let prevPy = null;
      for (let px = 0; px <= w; px++) {
        const y = fn((px - cx) / unit);
        if (!Number.isFinite(y)) { pen = false; prevPy = null; continue; }
        const py = cy - y * unit;
        // break the path off-screen and across asymptotes (tan, 1/x)
        if (py < -h * 2 || py > h * 3) { pen = false; prevPy = null; continue; }
        if (pen && prevPy !== null && Math.abs(py - prevPy) > h * 0.7) pen = false;
        if (pen) ctx.lineTo(px, py);
        else { ctx.moveTo(px, py); pen = true; }
        prevPy = py;
      }
      ctx.stroke();

      if (noteEl && noteEl.firstChild) {
        noteEl.firstChild.textContent = expr;
        if (noteEl.lastChild) noteEl.lastChild.textContent = `1u=${unit.toFixed(0)}px`;
      }
      return true;
    }

    const ELEMENT_RENDERERS = {
      graph(body, action) {
        const d = action.data || action;
        const gCanvas = document.createElement("canvas");
        const note = document.createElement("div");
        note.className = "plot-note";
        const label = document.createElement("span");
        const scale = document.createElement("span");
        note.append(label, scale);
        body.append(gCanvas, note);
        // no silent default: a missing equation shows as unparsed, not as x^2
        registerPlot(gCanvas, d.equation || d.expression || d.function || d.formula || "", note);
      },

      quiz(body, action) {
        const d = action.data || action;
        const expected = String(d.answer ?? "").trim();
        const choices = Array.isArray(d.choices) ? d.choices.slice(0, 6) : null;

        const q = document.createElement("div");
        q.className = "quiz-q";
        q.textContent = d.question || "Practice question";
        body.appendChild(q);

        const feedback = document.createElement("div");
        feedback.className = "quiz-feedback";

        let lastGiven = "";

        const hintBtn = document.createElement("button");
        hintBtn.type = "button";
        hintBtn.className = "secondary";
        hintBtn.style.marginTop = "6px";
        hintBtn.textContent = "ASK FOR A HINT";
        hintBtn.addEventListener("click", () => {
          handleCommand(
            `I answered "${lastGiven}" to "${String(d.question || "").slice(0, 160)}" and it was wrong. ` +
              "Give me a hint without telling me the answer."
          );
        });

        const mark = (correct, given) => {
          const card = body.closest(".card");
          lastGiven = String(given || "");
          eventForCard(body, correct ? "quiz_correct" : "quiz_wrong", {
            question: String(d.question || "").slice(0, 120),
            given: lastGiven.slice(0, 80),
            expected: expected.slice(0, 80),
            correct
          });

          if (correct) {
            feedback.className = "quiz-feedback ok";
            feedback.textContent = "CORRECT" + (expected ? ` — ${expected}` : "");
            card?.classList.add("quiz-solved");
            hintBtn.remove();
          } else {
            feedback.className = "quiz-feedback bad";
            feedback.textContent =
              `Not quite${given ? ` — you wrote "${given}"` : ""}. Try again, or reveal the answer.`;
            if (!hintBtn.isConnected) body.insertBefore(hintBtn, reveal);
          }
        };

        if (choices && choices.length) {
          const wrap = document.createElement("div");
          wrap.className = "quiz-choices";
          let solved = false;
          const rightIndex = correctChoiceIndex(choices.map(String), expected);
          choices.forEach((choice, index) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "quiz-choice";
            b.textContent = String(choice);
            b.addEventListener("click", () => {
              if (solved) return;
              const correct = index === rightIndex;
              b.classList.add(correct ? "ok" : "bad");
              solved = correct;
              mark(correct, String(choice));
            });
            wrap.appendChild(b);
          });
          body.appendChild(wrap);
        } else {
          // free-text answering: graded locally, no model call
          const row = document.createElement("div");
          row.className = "quiz-input-shell";

          const input = document.createElement("input");
          input.type = "text";
          input.placeholder = "Type your answer…";
          input.autocomplete = "off";
          input.spellcheck = false;

          const check = document.createElement("button");
          check.type = "button";
          check.textContent = "CHECK";

          const submit = () => {
            const given = input.value.trim();
            if (!given) { input.focus(); return; }
            mark(answersMatch(given, expected), given);
          };
          check.addEventListener("click", submit);
          input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              e.stopPropagation(); // don't submit the sidebar prompt form
              submit();
            }
          });

          row.append(input, check);
          body.appendChild(row);
        }

        const reveal = document.createElement("button");
        reveal.type = "button";
        reveal.className = "secondary";
        reveal.style.marginTop = "8px";
        reveal.textContent = "REVEAL ANSWER";
        reveal.addEventListener("click", () => {
          const shown = feedback.classList.contains("ok") && feedback.textContent.startsWith("ANSWER");
          if (shown) {
            feedback.className = "quiz-feedback";
            feedback.textContent = "";
          } else {
            feedback.className = "quiz-feedback ok";
            feedback.textContent = `ANSWER — ${expected || "not provided"}`;
            eventForCard(body, "quiz_revealed", {
              question: String(d.question || "").slice(0, 120),
              expected: expected.slice(0, 80)
            });
          }
        });

        body.append(reveal, feedback);
      },

      note(body, action) {
        const d = action.data || action;
        const n = document.createElement("div");
        n.className = "note-text";
        const md = d.text || d.body || d.markdown || d.content || d.md;
        if (!md) return; // renderInto falls back to the dynamic renderer
        n.appendChild(renderMarkdown(String(md)));
        body.appendChild(n);
      },

      // free-form card: a title plus a markdown body. This is the escape hatch that
      // lets the model compose anything instead of picking from fixed kinds.
      card(body, action) {
        const d = action.data || action;
        const md = d.body || d.markdown || d.text || d.content || d.md;
        if (!md) {
          ELEMENT_RENDERERS.dynamic(body, action);
          return;
        }
        body.appendChild(renderMarkdown(String(md)));
      },

      // 2D matrix (sudoku, truth table, pixel art): rows of arrays, or equal-length
      // strings like "53.7....." — models call this rows, puzzle, grid, board...
      grid(body, action) {
        const d = action.data || {};
        const found = findMatrix(d);
        if (!found) {
          ELEMENT_RENDERERS.dynamic(body, action);
          return;
        }

        const matrix = found.matrix.slice(0, 12);
        const width = Math.max(...matrix.map((row) => row.length));
        const table = document.createElement("table");
        table.className = "block-grid";
        matrix.forEach((row) => {
          const tr = document.createElement("tr");
          for (let i = 0; i < width; i += 1) {
            const td = document.createElement("td");
            const cell = row[i] === undefined || row[i] === null ? "" : String(row[i]).trim();
            // "0" means empty only in a 9x9 sudoku; elsewhere it is a real value
            const blank = /^[.\-_·•?]*$/.test(cell) || (cell === "0" && matrix.length === 9 && width === 9);
            td.textContent = blank ? "·" : cell;
            if (blank) td.classList.add("empty");
            tr.appendChild(td);
          }
          table.appendChild(tr);
        });
        body.appendChild(table);

        const caption = d.note || d.caption || d.hint || d.text;
        if (caption) {
          const n = document.createElement("div");
          n.className = "note-text";
          n.style.marginTop = "8px";
          n.textContent = String(caption);
          body.appendChild(n);
        }
      },

      // comparison table: data.headers + data.rows (rows as arrays or scalars)
      table(body, action) {
        const d = action.data || {};
        const headers = Array.isArray(d.headers) ? d.headers : Array.isArray(d.columns) ? d.columns : [];
        const rows = Array.isArray(d.rows) ? d.rows : [];
        if (!rows.length) {
          ELEMENT_RENDERERS.dynamic(body, action);
          return;
        }
        const table = document.createElement("table");
        table.className = "block-table";
        if (headers.length) {
          const thead = document.createElement("thead");
          const tr = document.createElement("tr");
          headers.slice(0, 6).forEach((h) => {
            const th = document.createElement("th");
            th.textContent = String(h);
            tr.appendChild(th);
          });
          thead.appendChild(tr);
          table.appendChild(thead);
        }
        const tbody = document.createElement("tbody");
        rows.slice(0, 12).forEach((row) => {
          const tr = document.createElement("tr");
          const cells = Array.isArray(row) ? row : row && typeof row === "object" ? Object.values(row) : [row];
          cells.slice(0, 6).forEach((cell) => {
            const td = document.createElement("td");
            td.textContent = formatBlockEntry(cell);
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        body.appendChild(table);
      },

      checklist(body, action) {
        const d = action.data || {};
        const items = firstArray(d) || [];
        if (!items.length) {
          ELEMENT_RENDERERS.dynamic(body, action);
          return;
        }
        const ul = document.createElement("ul");
        ul.className = "block-checklist";
        items.slice(0, 15).forEach((entry) => {
          const li = document.createElement("li");
          const label = document.createElement("label");
          const box = document.createElement("input");
          box.type = "checkbox";
          box.checked = Boolean(entry && typeof entry === "object" && (entry.done || entry.checked));
          const span = document.createElement("span");
          span.textContent = formatBlockEntry(entry);
          box.addEventListener("change", () => {
            eventForCard(body, "checklist_toggle", {
              item: span.textContent.slice(0, 100),
              checked: box.checked
            });
          });
          label.append(box, span);
          li.appendChild(label);
          ul.appendChild(li);
        });
        body.appendChild(ul);
      },

      // listed here so the proxy advertises it; the dynamic renderer numbers data.steps
      steps(body, action) {
        ELEMENT_RENDERERS.dynamic(body, action);
      },

      formula(body, action) {
        const d = action.data || {};
        const expr = String(d.expression || d.formula || d.equation || "").trim();
        const el = document.createElement("div");
        el.className = "block-formula";
        el.textContent = expr || "—";
        body.appendChild(el);
        const caption = d.note || d.notes || d.caption;
        if (caption) {
          const n = document.createElement("div");
          n.className = "note-text";
          n.textContent = formatBlockEntry(caption);
          body.appendChild(n);
        }
      },

      dynamic(body, action) {
        const raw = action.data;
        const d = raw && typeof raw === "object" ? raw : { value: raw ?? "" };

        const list = firstArray(d);

        if (list) {
          const ordered = Array.isArray(d.steps);
          const allStrings = list.every((entry) => typeof entry === "string");
          // "Domain: ..." style comparisons read as a two-column list, not bullets
          const colonPairs =
            !ordered &&
            allStrings &&
            list.length >= 3 &&
            list.filter((entry) => /^[^:]{1,40}:\s+\S/.test(entry)).length >= Math.ceil(list.length * 0.7);

          if (colonPairs) {
            renderKeyValueList(list, body);
            return;
          }

          const listEl = document.createElement(ordered ? "ol" : "ul");
          listEl.className = "block-list";
          list.slice(0, 20).forEach((entry) => {
            const li = document.createElement("li");
            li.textContent = formatBlockEntry(entry);
            listEl.appendChild(li);
          });
          body.appendChild(listEl);
          return;
        }

        // a long prose field is a card body, not a key/value pair
        const longText = Object.entries(d).find(
          ([key, value]) =>
            typeof value === "string" &&
            value.length > 180 &&
            /^(body|text|content|explanation|summary|markdown|md|details)$/i.test(key)
        );
        if (longText) {
          body.appendChild(renderMarkdown(longText[1]));
          return;
        }

        // key/value or formula style payloads get a definition list, not raw JSON
        const pairs = Object.entries(d).filter(
          ([, v]) => typeof v === "string" || typeof v === "number" || typeof v === "boolean"
        );
        if (pairs.length) {
          const dl = document.createElement("div");
          dl.className = "block-kv";
          pairs.slice(0, 14).forEach(([key, value]) => {
            const row = document.createElement("div");
            const k = document.createElement("span");
            k.className = "kv-key";
            k.textContent = key.replace(/[_-]+/g, " ");
            const v = document.createElement("span");
            v.className = "kv-val";
            v.textContent = String(value);
            row.append(k, v);
            dl.appendChild(row);
          });
          body.appendChild(dl);
          return;
        }

        const pre = document.createElement("pre");
        pre.style.whiteSpace = "pre-wrap";
        pre.style.fontSize = "11.5px";
        pre.style.lineHeight = "1.45";
        pre.textContent = JSON.stringify(d, null, 2);
        body.appendChild(pre);
      }
    };

    // Any 2D grid hiding in the payload: rows of arrays, or strings like "53.7....."
    // or "Row 1: 1 . 3 ." — models name it rows / puzzle / grid / items, so look.
    function parseMatrixRow(row) {
      if (Array.isArray(row)) return row.map((cell) => String(cell).trim());
      let text = String(row).trim();
      // drop a row label: "Row 1: 1 . 3 ." / "r2 - ..." / "1| ..."
      // (only real row labels: "T | F | T" must keep its first cell)
      text = text.replace(/^(?:row|r)\s*\d{1,2}\s*[:.\-\u2013|]\s*/i, "");
      const compact = text.replace(/\s+/g, "");
      // split per character for "53.7....." but not for "10 20 30"
      const packed = !/[\s,|]/.test(text) || text.split(/[\s,|]+/).some((t) => t.length > 1 && /[._#*?\u00b7]/.test(t));
      if (packed && /^[0-9.\-_#*?\u00b7]+$/.test(compact)) return compact.split("");
      return text.split(/[\s,|]+/).filter(Boolean);
    }

    function findMatrix(data) {
      if (!data || typeof data !== "object") return null;
      const preferred = ["rows", "grid", "puzzle", "board", "matrix", "cells", "items", "data"];
      const entries = Object.entries(data).filter(([, value]) => Array.isArray(value) && value.length >= 2);
      entries.sort((a, b) => {
        const ai = preferred.indexOf(a[0]);
        const bi = preferred.indexOf(b[0]);
        return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
      });

      for (const [key, value] of entries) {
        const rows = value.map(parseMatrixRow);
        if (rows.length < 2 || rows.some((row) => row.length < 2)) continue;
        if (new Set(rows.map((row) => row.length)).size !== 1) continue;
        // short cells only: prose split on spaces must not become a grid
        const cellLike = rows.every((row) => row.every((cell) => cell.length <= 3));
        if (cellLike) return { key, matrix: rows };
      }
      return null;
    }

    // ---- safe markdown ---------------------------------------------------
    // Model text is escaped FIRST, then a small markdown subset is turned into
    // elements. No raw HTML from the model ever reaches innerHTML.
    function escapeHtml(value) {
      return String(value).replace(
        /[&<>"']/g,
        (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])
      );
    }

    function inlineMarkup(text) {
      // split on code spans first, so "`2**x`" is never read as bold/italic
      return String(text)
        .split(/(`[^`]+`)/)
        .map((part) => {
          if (/^`[^`]+`$/.test(part)) return `<code>${escapeHtml(part.slice(1, -1))}</code>`;
          return escapeHtml(part)
            .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
            .replace(/(^|[^*\w])\*([^*\s](?:[^*\n]*[^*\s])?)\*(?!\w)/g, "$1<em>$2</em>")
            .replace(
              /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
              '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
            );
        })
        .join("");
    }

    function renderMarkdown(text) {
      const frag = document.createDocumentFragment();
      const lines = String(text ?? "").replace(/\r\n?/g, "\n").split("\n");
      const add = (tag, html, cls) => {
        const el = document.createElement(tag);
        if (cls) el.className = cls;
        if (html !== undefined) el.innerHTML = html;
        frag.appendChild(el);
        return el;
      };

      let i = 0;
      while (i < lines.length) {
        const line = lines[i];

        if (!line.trim()) { i += 1; continue; }

        if (/^\s*```/.test(line)) {
          const buf = [];
          i += 1;
          while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
          i += 1;
          add("pre", escapeHtml(buf.join("\n")), "md-pre");
          continue;
        }

        const heading = line.match(/^(#{1,4})\s+(.*)$/);
        if (heading) {
          add(`h${Math.min(4, heading[1].length + 2)}`, inlineMarkup(heading[2]), "md-h");
          i += 1;
          continue;
        }

        if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) {
          frag.appendChild(document.createElement("hr"));
          i += 1;
          continue;
        }

        if (line.includes("|") && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
          const cells = (row) =>
            row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
          const head = cells(line);
          i += 2;
          const table = document.createElement("table");
          table.className = "block-table";
          const thead = document.createElement("thead");
          const trh = document.createElement("tr");
          head.forEach((c) => {
            const th = document.createElement("th");
            th.innerHTML = inlineMarkup(c);
            trh.appendChild(th);
          });
          thead.appendChild(trh);
          table.appendChild(thead);
          const tbody = document.createElement("tbody");
          while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
            const tr = document.createElement("tr");
            cells(lines[i]).forEach((c) => {
              const td = document.createElement("td");
              td.innerHTML = inlineMarkup(c);
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
            i += 1;
          }
          table.appendChild(tbody);
          frag.appendChild(table);
          continue;
        }

        if (/^\s*[-*•]\s+/.test(line)) {
          const ul = document.createElement("ul");
          ul.className = "block-list";
          while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) {
            const li = document.createElement("li");
            li.innerHTML = inlineMarkup(lines[i].replace(/^\s*[-*•]\s+/, ""));
            ul.appendChild(li);
            i += 1;
          }
          frag.appendChild(ul);
          continue;
        }

        if (/^\s*\d+[.)]\s+/.test(line)) {
          const ol = document.createElement("ol");
          ol.className = "block-list";
          while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) {
            const li = document.createElement("li");
            li.innerHTML = inlineMarkup(lines[i].replace(/^\s*\d+[.)]\s+/, ""));
            ol.appendChild(li);
            i += 1;
          }
          frag.appendChild(ol);
          continue;
        }

        if (/^\s*>\s?/.test(line)) {
          const buf = [];
          while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
            buf.push(lines[i].replace(/^\s*>\s?/, ""));
            i += 1;
          }
          add("blockquote", inlineMarkup(buf.join(" ")), "md-quote");
          continue;
        }

        const para = [];
        while (
          i < lines.length &&
          lines[i].trim() &&
          !/^\s*(#{1,4}\s|```|>|[-*•]\s|\d+[.)]\s)/.test(lines[i]) &&
          !(para.length && lines[i].includes("|") && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1] || ""))
        ) {
          para.push(lines[i]);
          i += 1;
        }
        if (!para.length) para.push(lines[i++]);
        add("p", inlineMarkup(para.join(" ")), "md-p");
      }

      return frag;
    }

    // Models don't always use the field names you documented, so look for the first
    // array under the usual keys before giving up on it.
    function firstArray(data) {
      if (!data || typeof data !== "object") return null;
      for (const key of ["items", "steps", "checklist", "tasks", "bullets", "points", "list", "rows"]) {
        if (Array.isArray(data[key])) return data[key];
      }
      for (const value of Object.values(data)) {
        if (Array.isArray(value)) return value;
      }
      return null;
    }

    // "Key: value" bullets -> two-column key/value block
    function renderKeyValueList(list, body) {
      const dl = document.createElement("div");
      dl.className = "block-kv";
      list.slice(0, 20).forEach((entry) => {
        const idx = String(entry).indexOf(":");
        const row = document.createElement("div");
        const key = document.createElement("span");
        key.className = "kv-key";
        key.textContent = idx > 0 ? String(entry).slice(0, idx) : "";
        const val = document.createElement("span");
        val.className = "kv-val";
        val.textContent = idx > 0 ? String(entry).slice(idx + 1).trim() : String(entry);
        row.append(key, val);
        dl.appendChild(row);
      });
      body.appendChild(dl);
    }

    function formatBlockEntry(entry) {
      if (entry === null || entry === undefined) return "";
      if (typeof entry === "string") return entry;
      if (typeof entry === "number" || typeof entry === "boolean") return String(entry);
      if (Array.isArray(entry)) return entry.map(formatBlockEntry).join(" · ");
      // {task, done} / {name, value} style objects: join the meaningful fields only
      const values = Object.values(entry)
        .filter((v) => typeof v !== "boolean" && v !== null && v !== undefined)
        .map(formatBlockEntry)
        .filter(Boolean);
      return values.join(" — ");
    }

    function boxesOverlap(a, b, pad = 16) {
      return (
        a.x < b.x + b.w + pad &&
        a.x + a.w + pad > b.x &&
        a.y < b.y + b.h + pad &&
        a.y + a.h + pad > b.y
      );
    }

    // ---- layout ----------------------------------------------------------
    // The model hints *structure*, not pixels. The board packs the whole batch into
    // equal-width columns with consistent gutters, so a set of blocks reads as one
    // cluster instead of scattered guesses.
    const LAYOUT = { pad: 24, colW: 268, gutterX: 20, gutterY: 20, snap: 8 };

    function snapTo(v) {
      return Math.round(v / LAYOUT.snap) * LAYOUT.snap;
    }

    function columnCount() {
      const usable = stage.clientWidth - LAYOUT.pad * 2 + LAYOUT.gutterX;
      return Math.max(1, Math.min(4, Math.floor(usable / (LAYOUT.colW + LAYOUT.gutterX))));
    }

    function layoutBatch(records) {
      const cols = columnCount();
      const startX = Math.max(8, snapTo(-boardState.panX + LAYOUT.pad));
      const startY = Math.max(8, snapTo(-boardState.panY + LAYOUT.pad));
      const colY = new Array(cols).fill(startY);
      const taken = boardState.elements.map((e) => ({ x: e.x, y: e.y, w: e.w, h: e.h }));
      let lastCol = 0;

      records.forEach((record, index) => {
        const hint = record.hint || {};
        let col;

        if (Number.isInteger(hint.col)) {
          col = hint.col;
        } else if (hint.place === "below") {
          col = lastCol;
        } else if (hint.place === "right") {
          col = lastCol + 1;
        } else if (hint.place === "new-row" || hint.place === "left") {
          col = 0;
        } else if (index === 0) {
          col = 0;
        } else {
          // shortest column, ties to the left: keeps the cluster balanced
          col = 0;
          for (let i = 1; i < cols; i += 1) if (colY[i] < colY[col] - 1) col = i;
        }
        col = Math.max(0, Math.min(cols - 1, col));

        const x = Math.min(WORLD_MAX - record.w, startX + col * (LAYOUT.colW + LAYOUT.gutterX));
        let y = colY[col];
        let box = { x, y, w: record.w, h: record.h };

        // never land on an existing block: slide down this column until it is free
        for (let attempt = 0; attempt <= taken.length; attempt += 1) {
          const clash = taken.find((b) => boxesOverlap(box, b, 14));
          if (!clash) break;
          y = snapTo(clash.y + clash.h + LAYOUT.gutterY);
          box = { x, y, w: record.w, h: record.h };
        }

        y = Math.min(y, WORLD_MAX - record.h);
        taken.push({ ...box, y });
        record.x = x;
        record.y = y;
        colY[col] = y + record.h + LAYOUT.gutterY;
        lastCol = col;
      });
    }

    function pickRenderer(kind, data) {
      // own keys only: a kind of "constructor" must not resolve to Object
      if (hasOwn(ELEMENT_RENDERERS, kind)) return ELEMENT_RENDERERS[kind];
      if (Array.isArray(data.headers) && Array.isArray(data.rows)) return ELEMENT_RENDERERS.table;
      return findMatrix(data) ? ELEMENT_RENDERERS.grid : ELEMENT_RENDERERS.dynamic;
    }

    // Build the card, render it while hidden, measure it. Positioning happens in
    // layoutBatch once the whole batch is known.
    function mountElement(action) {
      const rawKind = action.kind || (action.type ? String(action.type).replace(/^add_/, "") : "note");
      const kind = String(rawKind).toLowerCase();
      const data = normalizeData(action);

      const newId = () => `el_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
      let id = action.id ? String(action.id) : newId();
      // ids must stay unique, including against blocks that undo may bring back
      const taken = [...boardState.elements, ...boardState.removed].some((el) => el.id === id) ||
        [...world.children].some((node) => node.dataset.id === id);
      if (taken) id = newId();

      const record = {
        id,
        kind,
        title: String(action.title || action.equation || kind.toUpperCase()).slice(0, 60),
        x: 0,
        y: 0,
        data,
        hint: {
          place: String(action.place || "").toLowerCase() || undefined,
          col: Number.isInteger(action.col) ? action.col : undefined
        }
      };

      const card = document.createElement("div");
      card.className = "card";
      const width = Number(action.w) || 268;
      card.style.width = `${Math.max(220, Math.min(LAYOUT.colW, width))}px`;
      const header = document.createElement("div");
      header.className = "card-header";

      const titleSpan = document.createElement("span");
      titleSpan.className = "card-title";
      titleSpan.textContent = record.title;

      const kindSpan = document.createElement("span");
      kindSpan.className = "card-kind";
      kindSpan.textContent = kind.toUpperCase();
      kindSpan.title = kind;

      const closeBtn = document.createElement("button");
      closeBtn.type = "button";
      closeBtn.className = "card-close";
      closeBtn.title = "Remove block";
      closeBtn.textContent = "X";
      closeBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
      closeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        removeElement(record, card);
      });

      header.append(kindSpan, titleSpan, closeBtn);

      const body = document.createElement("div");
      body.className = "card-body";

      const resizeGrip = document.createElement("div");
      resizeGrip.className = "card-resize";
      resizeGrip.title = "Drag to resize";

      card.append(header, body, resizeGrip);
      card.dataset.id = record.id;
      card.style.visibility = "hidden";
      card.style.left = "0px";
