      card.style.top = "0px";
      // mount BEFORE rendering: a canvas measures 0x0 while detached, which is
      // what left every graph card blank
      world.appendChild(card);
      renderInto(body, { ...action, kind, data });

      record.w = card.offsetWidth || 268;
      record.h = card.offsetHeight || 140;
      record.el = card;
      return record;
    }

    let topCardZ = 10;

    function commitElement(record) {
      // the block being touched comes to the front, so it never drags underneath
      record.el.addEventListener("pointerdown", () => { record.el.style.zIndex = ++topCardZ; }, true);
      record.el.style.left = `${record.x}px`;
      record.el.style.top = `${record.y}px`;
      record.el.style.visibility = "";
      makeDraggable(record.el, record);
      makeResizable(record.el, record);
      // reveals, hints and wrapping change a card's size; keep the snapshot true
      if (typeof ResizeObserver !== "undefined") {
        new ResizeObserver(() => {
          if (!record.el.isConnected) return;
          record.w = record.el.offsetWidth;
          record.h = record.el.offsetHeight;
        }).observe(record.el);
      }
      boardState.elements.push(record);
    }

    let micMutedUntil = 0;

    function speakReply(text) {
      if (!boardState.voiceMode || !("speechSynthesis" in window) || !text) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 1.02;
      utter.onend = utter.onerror = () => { micMutedUntil = Date.now() + 700; };
      window.speechSynthesis.speak(utter);
    }

    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    if (SpeechRec) {
      recognition = new SpeechRec();
      recognition.lang = "en-US";
      recognition.interimResults = true;
      recognition.continuous = true;

      recognition.onresult = (event) => {
        // otherwise the mic hears the spoken reply and sends it back as a command
        if (window.speechSynthesis?.speaking || Date.now() < micMutedUntil) return;
        let interim = "";
        let finalText = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const piece = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += piece;
          else interim += piece;
        }
        if (interim) {
          transcriptStrip.textContent = `LISTENING: ${interim}`;
          transcriptStrip.classList.add("visible");
        }
        if (finalText.trim()) {
          transcriptStrip.classList.remove("visible");
          handleCommand(finalText.trim(), true);
        }
      };

      recognition.onend = () => {
        if (boardState.voiceMode) {
          try { recognition.start(); } catch (_) {}
        }
      };

      // Without this, a denied mic or a network drop becomes an infinite loop:
      // Chrome fires error -> end -> start -> error, forever, with no feedback.
      recognition.onerror = (event) => {
        const fatal = ["not-allowed", "service-not-allowed", "audio-capture", "network", "language-not-supported"];
        if (!fatal.includes(event.error)) return;
        boardState.voiceMode = false;
        voiceToggle.classList.remove("active-voice");
        voiceToggle.textContent = "[V] VOICE: OFF";
        indVoice.textContent = "OFF";
        indVoice.classList.remove("live-voice");
        transcriptStrip.classList.remove("visible");
        addHistoryEntry("VOICE", `Microphone unavailable (${event.error}). Voice mode stopped.`, 0);
      };
    }

    // Proxy call. server.py injects the key, hardens the JSON and returns
    // { reply, actions }. If the proxy is down the board falls back to a
    // keyword mock so a venue-network failure never leaves a blank screen.
    const MOCK_EQUATION = "x^2 - 4*x + 3";

    // The longest run of maths in the prompt that compileExpression accepts.
    function findEquation(promptText) {
      const names = Object.keys({ ...EXPR_FUNCS, ...EXPR_CONSTS, x: 1 })
        .sort((a, b) => b.length - a.length)
        .join("|");
      const runs = String(promptText).match(
        new RegExp(`(?:(?<![a-z])(?:${names})(?![a-wyz])|\\d+(?:\\.\\d+)?|[-+*/^().²³π−\\s])+`, "gi")
      ) || [];
      return runs
        .map((run) => run.trim().replace(/^[).*/^\s]+|[-+*/^(.\s]+$/g, ""))
        .filter((run) => /(^|[^a-z])x(?![a-z])|\dx/i.test(run))
        .map((run) => run.replace(/X/g, "x"))
        .filter((run) => compileExpression(run))
        .sort((a, b) => b.length - a.length)[0] || null;
    }

    function mockPayload(promptText) {
      const text = String(promptText || "").toLowerCase();
      const actions = [];

      // prefer the requested function, else a named curve, else the default one
      const found = findEquation(promptText);
      const named = /\bsine?\b/.test(text) ? "sin(x)"
        : /\bcosine\b/.test(text) ? "cos(x)"
        : /\btangent\b/.test(text) ? "tan(x)"
        : null;
      const equation = found || named || MOCK_EQUATION;

      // a bare "x" in a sentence is not a request for a graph
      const looksLikeEquation = Boolean(found) && found !== "x";
      if (looksLikeEquation || named || /\b(graph|plot|curve|parabola|function)/.test(text)) {
        actions.push({
          kind: "graph",
          title: "PLOT",
          data: { equation }
        });
      }
      if (/\b(quiz|test|question|practice|check)/.test(text)) {
        actions.push({
          kind: "quiz",
          title: "ROOT CHECK",
          data: { question: "Find the roots of x^2 - 4x + 3 = 0.", answer: "x = 1 and x = 3" }
        });
      }
      if (/\b(step|derive|solve|how\b|explain)/.test(text)) {
        actions.push({
          kind: "steps",
          title: "WORKING (MOCK)",
          data: {
            steps: [
              "Start from ax^2 + bx + c = 0.",
              "Here a=1, b=-4, c=3.",
              "Factor as (x-1)(x-3) = 0.",
              "So x = 1 or x = 3."
            ]
          }
        });
      }
      if (!actions.length) {
        actions.push({
          kind: "note",
          title: "OFFLINE",
          data: {
            text: `Proxy not reachable — offline mock.\n\nYour command: ${promptText}`
          }
        });
      }
      return { reply: "Offline mock: the proxy isn't reachable.", actions, mock: true };
    }

    // longer than the proxy's worst case: two upstream calls of ROAR_TIMEOUT (45s) each
    const REQUEST_TIMEOUT_MS = 100000;

    async function fetchRoarActions(promptText) {
      const sentEvents = boardState.events.slice();
      const request = {
        command: promptText,
        capabilities: { kinds: rendererKinds() },
        board: boardState.elements.map((e) => ({
          id: e.id,
          kind: e.kind,
          title: e.title,
          x: Math.round(e.x),
          y: Math.round(e.y),
          w: e.w,
          h: e.h,
          data: e.data || {}
        })),
        viewport: {
          x: Math.round(-boardState.panX),
          y: Math.round(-boardState.panY),
          w: stage.clientWidth,
          h: stage.clientHeight
        },
        recent_events: sentEvents
      };

      // a hung proxy must not leave SEND disabled forever
      const abort = new AbortController();
      const timer = setTimeout(() => abort.abort(), REQUEST_TIMEOUT_MS);
      try {
        const res = await fetch(API_CONFIG.chat, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(request),
          signal: abort.signal
        });
        const payload = await res.json().catch(() => null);
        if (!res.ok || !payload || payload.error) {
          throw new Error(payload?.error || (res.ok ? "proxy sent invalid JSON" : `proxy HTTP ${res.status}`));
        }
        // only clear what was actually delivered: a failed call keeps the trail, and
        // anything the student did while we were waiting goes out with the next one
        boardState.events = boardState.events.filter((event) => !sentEvents.includes(event));
        return { reply: payload.reply || "", actions: Array.isArray(payload.actions) ? payload.actions : [] };
      } catch (err) {
        if (!API_CONFIG.offlineMock) throw err;
        addHistoryEntry("LINK", `Proxy unavailable (${err.message}) — offline mock.`, 0);
        return mockPayload(promptText);
      } finally {
        clearTimeout(timer);
      }
    }

    const OP_ALIASES = {
      spawn: "spawn", add: "spawn", create: "spawn",
      delete: "delete", remove: "delete", close: "delete",
      update: "update", move: "move", clear: "clear"
    };

    // The operation may arrive as op, or (models do this) as type or kind.
    function readOp(action) {
      if (action.op) {
        const op = String(action.op).toLowerCase();
        return hasOwn(OP_ALIASES, op) ? { op: OP_ALIASES[op], action } : { op: null, action };
      }
      for (const field of ["type", "kind"]) {
        const word = String(action[field] || "").toLowerCase();
        if (hasOwn(OP_ALIASES, word) && OP_ALIASES[word] !== "spawn") {
          // the word named the operation, so lift any target fields out of data
          const data = action.data && typeof action.data === "object" ? action.data : {};
          const lifted = { ...data, ...action, [field]: undefined, data: action.data };
          // inside data, a target is more specific than the action's own title
          if (data.target || data.title) {
            lifted.title = data.title;
            lifted.target = data.target;
          }
          return { op: OP_ALIASES[word], action: lifted };
        }
      }
      return { op: "spawn", action };
    }

    // One action can either spawn a block or operate on one that already exists.
    // Actions apply in order, so "add then move" and "clear then add" both work.
    function applyPayload(promptText, payload, fromVoice = false) {
      const actions = Array.isArray(payload.actions) ? payload.actions.slice(0, 8) : [];
      let pending = [];
      let spawned = 0;
      const done = [];

      const flush = () => {
        if (!pending.length) return;
        layoutBatch(pending);
        pending.forEach(commitElement);
        spawned += pending.length;
        pending = [];
        ensureWorldBounds(); // add blocks near the edge and the board extends
      };

      actions.forEach((raw) => {
        if (!raw || typeof raw !== "object") return;
        const { op, action } = readOp(raw);

        try {
          if (op === "spawn") {
            pending.push(mountElement(action));
            return;
          }
          if (!op) {
            done.push(`unknown operation "${raw.op}"`);
            return;
          }

          flush(); // later operations may target blocks added just above

          if (op === "clear") {
            const count = clearBoard();
            done.push(`cleared ${count} block${count === 1 ? "" : "s"}`);
            return;
          }

          const record = findRecord(action);
          if (!record) {
            done.push(`no block matched ${action.id || action.target_id || action.title || action.target || "?"}`);
            return;
          }
          if (op === "delete") {
            deleteRecord(record);
            done.push(`removed "${record.title}"`);
          } else if (op === "update") {
            done.push(updateRecord(record, action) ? `updated "${record.title}"` : `nothing to update on "${record.title}"`);
          } else if (op === "move") {
            done.push(moveRecord(record, action) ? `moved "${record.title}"` : `no position given for "${record.title}"`);
          }
        } catch (err) {
          addHistoryEntry("PANEL", `Could not apply ${op || "action"}: ${err.message}`, 0);
        }
      });

      flush();
      ensureWorldBounds();
      updateBlockCounter();

      const replyText = payload.reply || "Actions applied.";
      addHistoryEntry(promptText, done.length ? `${replyText} [${done.join("; ")}]` : replyText, spawned);
      if (fromVoice || boardState.voiceMode) {
        speakReply(replyText);
      }
    }

    let commandInFlight = false;

    async function handleCommand(text, fromVoice = false) {
      if (commandInFlight) {
        // one turn at a time, but say so instead of dropping the command silently
        addHistoryEntry(text, "Still working on the previous command. Try again in a moment.", 0);
        return;
      }
      commandInFlight = true;
      const sendBtn = promptForm.querySelector("button[type='submit']");
      if (sendBtn) {
        sendBtn.disabled = true;
        sendBtn.textContent = "...";
      }
      try {
        const payload = await fetchRoarActions(text);
        applyPayload(text, payload, fromVoice);
      } catch (err) {
        addHistoryEntry(text, `Error: ${err.message}`, 0);
      } finally {
        commandInFlight = false;
        if (sendBtn) {
          sendBtn.disabled = false;
          sendBtn.textContent = "SEND";
        }
      }
    }

    promptForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = promptInput.value.trim();
      if (!text) return;
      handleCommand(text, false);
      promptInput.value = "";
    });

    // Surface the proxy mode on load: judges (and you) can see live vs mock instantly.
    (async () => {
      try {
        const res = await fetch(API_CONFIG.health, { cache: "no-store" });
        const info = await res.json();
        const mode = info.mode === "live" ? `LIVE // ${info.model}` : "MOCK // no server key";
        addHistoryEntry("LINK", `Proxy ${mode}`, 0);
      } catch (_) {
        addHistoryEntry("LINK", "Proxy not running. Start it: python3 server.py", 0);
      }
    })();
  </script>
</body>
</html>
